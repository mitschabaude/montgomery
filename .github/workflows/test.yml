name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: node doc/zprize23/submission-test.ts
      - run: node doc/zprize23/submission-test-bls377.ts

  wide:
    # Wasm wide arithmetic needs --wasm-wide-arithmetic, which only Node nightlies support.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "27-nightly"
          cache: npm
      - run: npm ci
      - run: npm run test-wide

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: npm run test-browser

  publish:
    name: Publish version bump to npm
    needs: [test, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Check for an unpublished version bump
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node .github/scripts/check-release.ts
      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm ci
      - name: Publish with npm trusted publishing
        if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --tag "${{ steps.release.outputs.tag }}"
